name: Release

# Push a tag like v0.2.0 (matching "version" in extension/manifest.json) to publish a
# GitHub Release with the ready-to-install zip attached.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Tag matches manifest version
        run: |
          V=$(node -p "require('./extension/manifest.json').version")
          if [ "v$V" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match manifest version v$V" >&2
            exit 1
          fi
      - run: npm run check
      - run: npm test
      - run: npm run package
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "Salary Lens $GITHUB_REF_NAME" --generate-notes
